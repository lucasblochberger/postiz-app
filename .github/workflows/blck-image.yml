---
# Blck Alpaca: baut das gepatchte Postiz-Image (TikTok Content Sharing Guidelines)
# für den Hetzner-Server (amd64) und legt es in GHCR ab.
name: "Blck Image"

on:
  workflow_dispatch:
  push:
    branches:
      - blck/tiktok-audit-v2.23

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to ghcr
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and Push Image
        run: |
          IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/postiz-blck
          docker buildx build --platform linux/amd64 \
            -f Dockerfile.dev \
            -t $IMAGE:tiktok-audit-v2.23 \
            -t $IMAGE:tiktok-audit-v2.23-${GITHUB_SHA::7} \
            --build-arg NEXT_PUBLIC_VERSION=v2.23.0-blck \
            --provenance=false --sbom=false \
            --push .
